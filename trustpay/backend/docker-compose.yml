services:
  postgres:
    image: postgres:16-alpine
    container_name: trustpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustpay}
      POSTGRES_USER: ${POSTGRES_USER:-trustpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trustpay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  trustpay_postgres_data:
